name: Manually build package

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      valkey_tag:
        description: "Version Tag (e.g. 9.1.1)"
        default: "9.1.1"
        required: true
      flavor:
        description: "Debian/Ubuntu flavor (e.g. debian:trixie, ubuntu:noble)"
        default: "debian:trixie"
        required: true
      arch:
        type: choice
        description: "Architecture"
        options:
          - "amd64"
          - "arm64"
        default: "amd64"
        required: true

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: build-debian

      - name: Validate Flavor
        run: |
          set -eu
          flavor="${{ inputs.flavor }}"
          if ! grep -qx "${flavor}" build-debian/.github/supported-releases.txt; then
            echo "Unsupported flavor: ${flavor}"
            echo "Supported flavors:"
            cat build-debian/.github/supported-releases.txt
            exit 1
          fi

      - name: Set valkey_tag
        id: set-tag
        run: |
          tag="${{ inputs.valkey_tag }}"
          tag="${tag#v}"
          tag="${tag#V}"
          tag="${tag#Release/}"
          tag="${tag#release/}"
          echo "valkey_tag=${tag}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          repository: valkey-io/valkey
          ref: refs/tags/${{ env.valkey_tag }}
          submodules: "recursive"

      - name: Extract OS Flavor and Version
        run: |
          os_version="${{ inputs.flavor }}"
          echo "flavor=${os_version%%:*}" >> "$GITHUB_ENV"
          echo "debian_release=${os_version##*:}" >> "$GITHUB_ENV"

      - uses: jtdor/build-deb-action@v1.9.1
        env:
          DEB_BUILD_OPTIONS: noautodbgsym
        with:
          docker-image: "${{ inputs.flavor }}"
          host-arch: "${{ inputs.arch }}"
          setup-hook: |
            export DEBIAN_FRONTEND=noninteractive
            os_version="${{ inputs.flavor }}"
            flavor="${os_version%%:*}"
            arch="${{ inputs.arch }}"
            if [ "$flavor" = "ubuntu" ] && [ "$arch" = "arm64" ]; then
              # check for deb822 source format
              if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
                cp /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list.d/ubuntu-arm.sources
                sed -i 's,[a-z]*.ubuntu.com,ports.ubuntu.com,' /etc/apt/sources.list.d/ubuntu-arm.sources
                sed -i 's,/ubuntu/$,/ubuntu-ports/,' /etc/apt/sources.list.d/ubuntu-arm.sources
                sed -i 's/^Components:/Architectures: arm64\nComponents:/' /etc/apt/sources.list.d/ubuntu-arm.sources
                sed -i 's/^Components:/Architectures: amd64\nComponents:/' /etc/apt/sources.list.d/ubuntu.sources
              else
                cp /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu-arm.list
                sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
                sed -i 's,[a-z]*.ubuntu.com,ports.ubuntu.com,' /etc/apt/sources.list.d/ubuntu-arm.list
                sed -i 's,/ubuntu/ ,/ubuntu-ports/ ,' /etc/apt/sources.list.d/ubuntu-arm.list
                sed -i 's/^deb /deb [arch=arm64] /' /etc/apt/sources.list.d/ubuntu-arm.list
                cat /etc/apt/sources.list  /etc/apt/sources.list.d/ubuntu-arm.list
              fi
            fi
            if [ "$os_version" = "debian:bullseye" ]; then
              # Bullseye is no longer on the main mirrors; use snapshot.debian.org
              # so the package versions remain available. Disable the Valid-Until
              # check because the InRelease of an archived snapshot may be expired.
              mkdir -p /etc/apt/apt.conf.d
              printf 'Acquire::Check-Valid-Until "false";\n' > /etc/apt/apt.conf.d/90snapshot
              if [ -f /etc/apt/sources.list ] && grep -q '^# deb http://snapshot\.debian\.org' /etc/apt/sources.list; then
                grep '^# deb http://snapshot\.debian\.org' /etc/apt/sources.list | sed 's/^# *//' > /etc/apt/sources.list.new
                mv -f /etc/apt/sources.list.new /etc/apt/sources.list
              else
                printf '%s\n' \
                  'deb http://snapshot.debian.org/archive/debian/20260824T000000Z bullseye main' \
                  'deb http://snapshot.debian.org/archive/debian-security/20260824T000000Z bullseye-security main' \
                  'deb http://snapshot.debian.org/archive/debian/20260824T000000Z bullseye-updates main' \
                  > /etc/apt/sources.list
              fi
            fi

            if [ "$arch" = "arm64" ]; then
              dpkg --add-architecture arm64
              apt-get update
              apt-get install -y libatomic1:arm64
            fi

            cp -vr /github/workspace/build-debian/debian /github/workspace/
          extra-build-deps: "devscripts git dpkg-cross"
          before-build-hook: "DEBEMAIL='GitHub Actions <github-actions@users.noreply.github.com>' dch -v ${{ env.valkey_tag }}~${{ env.debian_release }} 'GitHub manual build for ${{ inputs.flavor }}'"
          buildpackage-opts: --build=binary --no-sign -d

      - name: Upload deb files
        uses: actions/upload-artifact@v7
        with:
          name: "packages-${{ env.debian_release }}-${{ inputs.arch }}"
          path: ./debian/artifacts/*
