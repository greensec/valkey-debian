name: Build repository release

permissions:
  contents: read

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      valkey_tag:
        description: "Version Tag (e.g. 9.1.1)"
        default: "9.1.1"
        required: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      os_matrix: ${{ steps.releases.outputs.os_matrix }}
      repo_versions: ${{ steps.releases.outputs.repo_versions }}
    steps:
      - uses: actions/checkout@v7
      - name: Load Supported Releases
        id: releases
        run: |
          set -eu
          mapfile -t releases < <(grep -E '^[a-z]+:[a-z0-9]+$' .github/supported-releases.txt)
          if [ "${#releases[@]}" -eq 0 ]; then
            echo "No supported releases found in .github/supported-releases.txt"
            exit 1
          fi

          os_matrix="$(printf '%s\n' "${releases[@]}" | jq -R . | jq -s -c .)"
          repo_versions="$(printf '%s\n' "${releases[@]}" | cut -d: -f2)"

          echo "os_matrix=${os_matrix}" >> "$GITHUB_OUTPUT"
          {
            echo "repo_versions<<EOF"
            printf '%s\n' "${repo_versions}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs:
      - prepare
    strategy:
      fail-fast: false
      matrix:
        os-version: ${{ fromJson(needs.prepare.outputs.os_matrix) }}
        arch: ["amd64", "arm64"]
    steps:
      - name: Set valkey_tag
        id: set-tag
        run: |
          tag="${{ github.event.inputs.valkey_tag }}"
          tag="${tag#v}"
          tag="${tag#V}"
          tag="${tag#Release/}"
          tag="${tag#release/}"
          echo "valkey_tag=${tag}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          repository: valkey-io/valkey
          ref: refs/tags/${{ env.valkey_tag }}
          submodules: "recursive"

      - uses: actions/checkout@v7
        with:
          path: build-debian

      - name: Extract OS Flavor and Version
        id: extract-os
        run: |
          os_version="${{ matrix.os-version }}"
          echo "flavor=${os_version%%:*}" >> "$GITHUB_ENV"
          echo "debian_release=${os_version##*:}" >> "$GITHUB_ENV"

      - uses: jtdor/build-deb-action@v1.9.1
        env:
          DEB_BUILD_OPTIONS: noautodbgsym
        with:
          docker-image: "${{ matrix.os-version }}"
          host-arch: "${{ matrix.arch }}"
          setup-hook: |
            export DEBIAN_FRONTEND=noninteractive
            os_version="${{ matrix.os-version }}"
            flavor="${os_version%%:*}"
            arch="${{ matrix.arch }}"
            if [ "$flavor" = "ubuntu" ] && [ "$arch" = "arm64" ]; then
              # check for deb822 source format
              if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
                cp /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list.d/ubuntu-arm.sources
                sed -i 's,[a-z]*.ubuntu.com,ports.ubuntu.com,' /etc/apt/sources.list.d/ubuntu-arm.sources
                sed -i 's,/ubuntu/$,/ubuntu-ports/,' /etc/apt/sources.list.d/ubuntu-arm.sources
                sed -i 's/^Components:/Architectures: arm64\nComponents:/' /etc/apt/sources.list.d/ubuntu-arm.sources
                sed -i 's/^Components:/Architectures: amd64\nComponents:/' /etc/apt/sources.list.d/ubuntu.sources
              else
                cp /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu-arm.list
                sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
                sed -i 's,[a-z]*.ubuntu.com,ports.ubuntu.com,' /etc/apt/sources.list.d/ubuntu-arm.list
                sed -i 's,/ubuntu/ ,/ubuntu-ports/ ,' /etc/apt/sources.list.d/ubuntu-arm.list
                sed -i 's/^deb /deb [arch=arm64] /' /etc/apt/sources.list.d/ubuntu-arm.list
                cat /etc/apt/sources.list  /etc/apt/sources.list.d/ubuntu-arm.list
              fi
            fi
            if [ "$os_version" = "debian:bullseye" ]; then
              # Bullseye is no longer on the main mirrors; use snapshot.debian.org
              # so the package versions remain available. Disable the Valid-Until
              # check because the InRelease of an archived snapshot may be expired.
              mkdir -p /etc/apt/apt.conf.d
              printf 'Acquire::Check-Valid-Until "false";\n' > /etc/apt/apt.conf.d/90snapshot
              if [ -f /etc/apt/sources.list ] && grep -q '^# deb http://snapshot\.debian\.org' /etc/apt/sources.list; then
                grep '^# deb http://snapshot\.debian\.org' /etc/apt/sources.list | sed 's/^# *//' > /etc/apt/sources.list.new
                mv -f /etc/apt/sources.list.new /etc/apt/sources.list
              else
                printf '%s\n' \
                  'deb http://snapshot.debian.org/archive/debian/20260824T000000Z bullseye main' \
                  'deb http://snapshot.debian.org/archive/debian-security/20260824T000000Z bullseye-security main' \
                  'deb http://snapshot.debian.org/archive/debian/20260824T000000Z bullseye-updates main' \
                  > /etc/apt/sources.list
              fi
            fi

            if [ "$arch" = "arm64" ]; then
              dpkg --add-architecture arm64
              apt-get update
              apt-get install -y libatomic1:arm64
            fi

            cp -vr /github/workspace/build-debian/debian /github/workspace/
          extra-build-deps: "devscripts git dpkg-cross"
          before-build-hook: "DEBEMAIL='GitHub Actions <github-actions@users.noreply.github.com>' dch -b -v ${{ env.valkey_tag }}~${{ env.debian_release }} 'GitHub build for ${{ matrix.os-version }}'"
          buildpackage-opts: --build=binary --no-sign -d
      - name: Upload deb files
        uses: actions/upload-artifact@v7
        with:
          name: "packages-${{ env.debian_release }}-${{ matrix.arch }}"
          path: ./debian/artifacts/*

  merge-artefacts:
    name: Merge all deb files to single artifact
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: debian-packages
        uses: actions/upload-artifact/merge@v7

  add_release:
    name: Add package to release
    needs: merge-artefacts
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: debian-packages
        uses: actions/download-artifact@v8
        with:
          name: merged-artifacts
      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./*.deb

  add_repo:
    name: Add packages to public debian repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - merge-artefacts
      - prepare
    steps:
      - name: debian-packages
        uses: actions/download-artifact@v8
        with:
          name: "merged-artifacts"
      - name: Add releases to repo
        uses: smeinecke/apt-repo-action@v2.1.8
        with:
          github_token: ${{ github.token }}
          repo_supported_arch: |
            amd64
            arm64
          repo_supported_version: ${{ needs.prepare.outputs.repo_versions }}
          file: |
            *.deb
          version_by_filename: true
          private_key: ${{ secrets.APT_SIGNING_KEY }}
          public_key: ${{ vars.APT_PUBLIC_KEY }}
          key_passphrase: ""
          skip_duplicates: true
